openapi: 3.1.0
info:
  title: Broken Ranks Tool API
  version: 1.0.0
  description: Same-origin API used by the equipment builder and optimizer.
  license:
    name: AGPL-3.0-only
    url: https://github.com/kamil-b-dev/Broken_Ranks_Tool/blob/master/LICENSE
servers:
  - url: /
security: []
paths:
  /api/initial-data:
    get:
      operationId: getInitialData
      summary: Return the complete catalogue, dictionaries, and game rules.
      responses:
        "200":
          description: Initial application data.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitialData"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/items:
    get:
      operationId: getItems
      summary: Return all item templates.
      responses:
        "200":
          description: Catalogue templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemTemplate"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/items/category/{category}:
    get:
      operationId: getItemsByCategory
      summary: Return item templates in one equipment category.
      parameters:
        - name: category
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Catalogue templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItemTemplate"
        "400":
          $ref: "#/components/responses/ApiFailure"
        "404":
          description: No item templates exist for the category. The response has no body.
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/orbs:
    get:
      operationId: getOrbs
      summary: Return all orb templates.
      responses:
        "200":
          description: Catalogue templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrbTemplate"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/drifs:
    get:
      operationId: getDrifs
      summary: Return all drif templates.
      responses:
        "200":
          description: Catalogue templates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DrifTemplate"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/rules:
    get:
      operationId: getGameRules
      summary: Return calculation and placement rules used by the frontend.
      responses:
        "200":
          description: Game rules keyed by stable enum names.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicGameRules"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/dictionaries/categories:
    get:
      operationId: getItemCategoryDictionary
      summary: Return translated item category names.
      responses:
        "200":
          $ref: "#/components/responses/Dictionary"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/dictionaries/orb-categories:
    get:
      operationId: getOrbCategoryDictionary
      summary: Return translated orb category names.
      responses:
        "200":
          $ref: "#/components/responses/Dictionary"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/dictionaries/drif-categories:
    get:
      operationId: getDrifCategoryDictionary
      summary: Return translated drif category names.
      responses:
        "200":
          $ref: "#/components/responses/Dictionary"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/calculator/calculate:
    post:
      operationId: calculateEquipment
      summary: Validate an equipment setup and calculate its statistics.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipmentRequest"
      responses:
        "200":
          description: Calculated values with source classifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResult"
        "400":
          $ref: "#/components/responses/ApiFailure"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/optimizer/drifs:
    post:
      operationId: optimizeDrifs
      summary: Optimize from the catalogue or advise changes to the current build.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptimizationRequest"
      responses:
        "200":
          description:
            HTTP 200 may contain a business failure or a valid calculator-verified build with unmet
            soft targets. Both may have summary.success=false; a valid build still includes optimizedSetup,
            calculationResult and warnings explaining the unmet targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptimizationResponse"
        "400":
          $ref: "#/components/responses/ApiFailure"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/OptimizerUnavailable"
  /api/optimizer/advisor/{runId}/cancel:
    post:
      operationId: cancelAdvisorRun
      summary: Request cooperative cancellation of an advisor run.
      requestBody:
        required: false
        description: Empty body or JSON null only. Other JSON values and malformed JSON are rejected before cancellation.
        content:
          application/json:
            schema:
              type: "null"
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
        - name: X-Advisor-Cancellation-Token
          in: header
          required: true
          description: Independent random token supplied with the advisor request.
          schema:
            type: string
            format: uuid
            pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      responses:
        "200":
          description: Whether a matching active run was marked for cancellation. A matching request still in transit remembers the cancellation intent for 10 seconds; a false result only means there was no active matching flag to set.
          content:
            application/json:
              schema:
                type: object
                required:
                  - cancelled
                properties:
                  cancelled:
                    type: boolean
        "400":
          $ref: "#/components/responses/ApiFailure"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  responses:
    Dictionary:
      description: Labels keyed by stable enum names.
      content:
        application/json:
          schema:
            type: object
            additionalProperties:
              type: string
    ApiFailure:
      description: Invalid or forbidden request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RequestTooLarge:
      description: Request body exceeds the configured 256 KiB default limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    OptimizerUnavailable:
      description: New optimization or advisor search rejected because JVM heap usage reached the admission threshold. Code is OPTIMIZER_MEMORY_PRESSURE; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: Per-client or whole-instance one-minute allowance exhausted.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type:
            - string
            - "null"
    SlotData:
      type: object
      additionalProperties: false
      properties:
        itemId:
          type:
            - integer
            - "null"
          format: int64
        itemStars:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 9
        orbIds:
          type:
            - array
            - "null"
          maxItems: 2
          items:
            type:
              - integer
              - "null"
            format: int64
        orbLevels:
          type:
            - array
            - "null"
          maxItems: 2
          items:
            type:
              - integer
              - "null"
        drifIds:
          type:
            - array
            - "null"
          maxItems: 8
          items:
            type:
              - integer
              - "null"
            format: int64
        drifLevels:
          type:
            - object
            - "null"
          maxProperties: 8
          additionalProperties:
            type: integer
    CharacterStats:
      type:
        - object
        - "null"
      description: Absolute character statistics, including development points already converted by the client. Supported canonical names are PŻ, Mana, Kondycja, Siła, Zręczność, Moc, Wiedza, Inteligencja and Obrażenia; names are case-insensitive. Each canonical total must be at most 50000, including case aliases. Intelligence starts at 10 and gains 1 per development point, like strength and power. Missing values are not filled by the calculator; empty maps remain empty. No current item grants intelligence.
      maxProperties: 32
      propertyNames:
        pattern: "^([Pp][Żż]|[Mm][Aa][Nn][Aa]|[Kk][Oo][Nn][Dd][Yy][Cc][Jj][Aa]|[Ss][Ii][Łł][Aa]|[Zz][Rr][Ęę][Cc][Zz][Nn][Oo][Śś][Ćć]|[Mm][Oo][Cc]|[Ww][Ii][Ee][Dd][Zz][Aa]|[Ii][Nn][Tt][Ee][Ll][Ii][Gg][Ee][Nn][Cc][Jj][Aa]|[Oo][Bb][Rr][Aa][Żż][Ee][Nn][Ii][Aa])$"
      additionalProperties:
        type: integer
        minimum: 0
        maximum: 50000
      example:
        PŻ: 200
        Mana: 200
        Kondycja: 200
        Siła: 10
        Zręczność: 10
        Moc: 10
        Wiedza: 10
        Inteligencja: 10
    EquipmentRequest:
      type: object
      additionalProperties: false
      properties:
        slots:
          type:
            - object
            - "null"
          maxProperties: 12
          additionalProperties:
            $ref: "#/components/schemas/SlotData"
        characterStats:
          $ref: "#/components/schemas/CharacterStats"
    CalculationResult:
      type: object
      required:
        - stats
        - drifCategories
        - orbBonusTypes
      properties:
        stats:
          type: object
          additionalProperties:
            type: string
        drifCategories:
          type: object
          additionalProperties:
            type: string
        orbBonusTypes:
          type: array
          uniqueItems: true
          items:
            type: string
    OptimizationRequest:
      type: object
      additionalProperties: false
      description: Canonical request representation. Enum values and enum map keys require names, never indexes. Unknown fields and duplicate JSON keys are rejected. Legacy numeric strings and existing boolean scalar conversions remain supported during deserialization.
      required:
        - originalSlots
      properties:
        mode:
          type: string
          enum:
            - BUILD_FROM_SCRATCH
            - ADVISOR
          default: BUILD_FROM_SCRATCH
        configurationMode:
          type: string
          enum:
            - SIMPLE
            - ADVANCED
          default: ADVANCED
        simpleProfile:
          type:
            - string
            - "null"
          enum:
            - BARBARIAN
            - KNIGHT
            - ARCHER
            - FIRE_MAGE
            - DRUID
            - SHEED
            - VOODOO
            - MAGICAL
            - MAGICAL_RANGED
            - MAGICAL_MENTAL
            - PHYSICAL_MELEE
            - PHYSICAL_RANGED
            - null
        simpleOptions:
          anyOf:
            - $ref: "#/components/schemas/SimpleOptions"
            - type: "null"
        simpleAspects:
          type:
            - object
            - "null"
          maxProperties: 6
          additionalProperties:
            type: string
            enum:
              - NORMAL
              - IMPORTANT
              - KEY
        characterStats:
          $ref: "#/components/schemas/CharacterStats"
        originalSlots:
          type: object
          minProperties: 1
          maxProperties: 12
          additionalProperties:
            $ref: "#/components/schemas/SlotData"
        backpackOnly:
          type: boolean
          default: false
          description: Advanced build-from-scratch only. Run standard optimization, then substitute matching selected backpack drifs at their owned levels. Unmatched catalog drifs remain. The legacy wire name is retained; additional variants are unavailable.
        backpackDrifs:
          type:
            - array
            - "null"
          maxItems: 200
          description: Selected loose drif occurrences. Each id must be unique; the size bound is validated before optimizer execution.
          items:
            type: object
            additionalProperties: false
            required: [id, templateId, level]
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
              templateId:
                type: integer
                format: int64
                minimum: 1
              level:
                type: integer
                minimum: 1
                maximum: 21
        priorities:
          type: object
          description:
            At least one priority is required in advanced mode; named simple profiles resolve priorities
            server-side.
          maxProperties: 32
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 30
        targetQuantities:
          type: object
          maxProperties: 32
          additionalProperties:
            type: object
            additionalProperties: false
            required:
              - min
              - max
            properties:
              min:
                type: integer
                minimum: 0
                maximum: 12
              max:
                type: integer
                minimum: 0
                maximum: 12
        drifSizeQuantities:
          type: object
          description: Liczności rozmiarów obejmują zwykłe i wbudowane drify. Wbudowane drify przekraczające maksimum są zachowywane z ostrzeżeniem; wyjątek nie pozwala dodawać kolejnych drifów ponad limit.
          maxProperties: 32
          additionalProperties:
            type: object
            maxProperties: 4
            additionalProperties:
              type: object
              additionalProperties: false
              required:
                - min
                - max
              properties:
                min:
                  type: integer
                  minimum: 0
                  maximum: 12
                max:
                  type: integer
                  minimum: 0
                  maximum: 12
        lockedSlots:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
        lockedDrifs:
          type: object
          maxProperties: 12
          additionalProperties:
            type: array
            maxItems: 8
            uniqueItems: true
            items:
              type: integer
        forceCapBonuses:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
        forcedPercentageTargets:
          type: object
          maxProperties: 32
          additionalProperties:
            type: number
            minimum: 0
        maximizeBonuses:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            type: string
        forceMaximizationByDrifBonus:
          type: boolean
        generateVariants:
          type: boolean
        maxVariantLossPercent:
          type: integer
          minimum: 0
          maximum: 100
        advisor:
          oneOf:
            - $ref: "#/components/schemas/AdvisorOptions"
            - type: "null"
    AdvisorOptions:
      type: object
      additionalProperties: false
      required:
        - goal
      dependentRequired:
        runId:
          - cancellationToken
        cancellationToken:
          - runId
      properties:
        goal:
          type: string
        strategy:
          type: string
          enum:
            - MINIMUM_CHANGE
            - BEST_RESULT
          default: MINIMUM_CHANGE
        runId:
          type:
            - string
            - "null"
          format: uuid
        cancellationToken:
          type:
            - string
            - "null"
          format: uuid
          description: Required together with runId and used only to authorize cancellation.
        timeBudgetMs:
          type: integer
          enum:
            - 3000
            - 6000
          default: 3000
        maxActions:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
        targetValue:
          type:
            - number
            - "null"
          minimum: 0
        targetGain:
          type:
            - number
            - "null"
          minimum: 0
        limitBenefitToTarget:
          type: boolean
          default: false
          description: Stop rewarding the main modifier at its explicit target rather than its natural cap. Has no effect without a finite requested target.
        purchaseScope:
          type: string
          enum:
            - GOAL_ONLY
            - GOAL_AND_PROTECTED
            - ANY
          default: GOAL_ONLY
          description: Bonus types considered when drif purchases are enabled. Protected means an active protection derived from the baseline build.
        profession:
          type: string
          enum:
            - AUTO
            - MAGICAL
            - PHYSICAL
            - UNIVERSAL
          default: AUTO
        allowedChanges:
          type: object
          additionalProperties: false
          properties:
            stars:
              type: boolean
              default: true
            items:
              type: boolean
              default: false
            drifs:
              type: boolean
              default: false
            drifUpgrades:
              type: boolean
              default: false
        protectedModifiers:
          type: object
          maxProperties: 32
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              enabled:
                type: boolean
                default: true
              loss:
                type: number
                minimum: 0
                default: 0
    InitialData:
      type: object
      additionalProperties: false
      required:
        - items
        - orbs
        - drifs
        - gameRules
        - dictionaries
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemTemplate"
        orbs:
          type: array
          items:
            $ref: "#/components/schemas/OrbTemplate"
        drifs:
          type: array
          items:
            $ref: "#/components/schemas/DrifTemplate"
        gameRules:
          $ref: "#/components/schemas/GameRules"
        dictionaries:
          $ref: "#/components/schemas/Dictionaries"
    SimpleOptions:
      type: object
      additionalProperties: false
      properties:
        damageDrifs:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 12
        accuracyDrifs:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 12
        style:
          type:
            - string
            - "null"
          enum:
            - OFFENSIVE
            - DEFENSIVE
            - null
        element:
          type:
            - string
            - "null"
          enum:
            - NONE
            - FIRE
            - FROST
            - ENERGY
            - null
        passiveDamageReduction:
          type:
            - boolean
            - "null"
        percentageDamageReduction:
          type:
            - boolean
            - "null"
        damageReductionChance:
          type:
            - boolean
            - "null"
        dodgeChance:
          type:
            - boolean
            - "null"
    ItemTemplate:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - category
        - tier
        - reqLevel
        - boss
        - capacity
        - stats
        - rarity
        - profile
        - classScope
        - allowedClasses
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        tier:
          type: string
        reqLevel:
          type: integer
        boss:
          type:
            - string
            - "null"
        capacity:
          type:
            - integer
            - "null"
        stats:
          type:
            - object
            - "null"
          description: Base item statistics and resistances are integers. Special item modifiers may be fractional.
          additionalProperties:
            type: number
        rarity:
          type: string
        profile:
          type:
            - string
            - "null"
        classScope:
          type:
            - string
            - "null"
        allowedClasses:
          type:
            - array
            - "null"
          items:
            type: string
    DrifTemplate:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - baseValue
        - increment
        - size
        - bonusType
        - rankRange
        - price
        - category
      properties:
        id:
          type: integer
        name:
          type: string
        baseValue:
          type: string
        increment:
          type: string
        size:
          type: string
          enum:
            - SUBDRIF
            - BIDRIF
            - MAGNIDRIF
            - ARCYDRIF
        bonusType:
          type: string
        rankRange:
          type:
            - string
            - "null"
        price:
          type: integer
        category:
          type: string
    OrbTemplate:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - size
        - category
        - bonusType
        - bonusLvl1
        - bonusLvl2
        - bonusLvl3
        - rankRange
        - price
      properties:
        id:
          type: integer
        name:
          type: string
        size:
          type: string
          enum:
            - SUBORB
            - BIORB
            - MAGNIORB
            - ARCYORB
        category:
          type: string
        bonusType:
          type: string
        bonusLvl1:
          type:
            - string
            - "null"
        bonusLvl2:
          type:
            - string
            - "null"
        bonusLvl3:
          type:
            - string
            - "null"
        rankRange:
          type:
            - string
            - "null"
        price:
          type: integer
    GameRules:
      type: object
      additionalProperties: false
      required:
        - epicBuiltInDrifs
        - slotOrbRules
        - bonusTranslations
        - drifBasePowers
        - drifMaxCaps
        - drifBonusCategories
        - elementalTypes
        - drifPenaltyMultipliers
      properties:
        epicBuiltInDrifs:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        slotOrbRules:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        bonusTranslations:
          type: object
          additionalProperties:
            type: string
        drifBasePowers:
          type: object
          additionalProperties:
            type: integer
        drifMaxCaps:
          type: object
          additionalProperties:
            type:
              - integer
              - "null"
        drifBonusCategories:
          type: object
          additionalProperties:
            type: string
        elementalTypes:
          type: array
          items:
            type: string
        drifPenaltyMultipliers:
          type: object
          additionalProperties:
            type: number
    Dictionaries:
      type: object
      additionalProperties: false
      required:
        - itemCategories
        - orbCategories
        - drifCategories
      properties:
        itemCategories:
          type: object
          additionalProperties:
            type: string
        orbCategories:
          type: object
          additionalProperties:
            type: string
        drifCategories:
          type: object
          additionalProperties:
            type: string
    GoalResult:
      type: object
      additionalProperties: false
      required:
        - statKey
        - bonusName
        - priority
        - placedCount
        - minimumCount
        - maximumCount
        - calculatorValue
        - targetLabel
        - quantitySatisfied
        - targetSatisfied
      properties:
        statKey:
          type:
            - string
            - "null"
        bonusName:
          type:
            - string
            - "null"
        priority:
          type: integer
        placedCount:
          type: integer
        minimumCount:
          type: integer
        maximumCount:
          type: integer
        calculatorValue:
          type:
            - string
            - "null"
        targetLabel:
          type:
            - string
            - "null"
        quantitySatisfied:
          type: boolean
        targetSatisfied:
          type:
            - boolean
            - "null"
    PlacementChange:
      type: object
      additionalProperties: false
      required:
        - slotKey
        - itemName
        - fromModifier
        - fromLevel
        - toModifier
        - toLevel
      properties:
        slotKey:
          type: string
        itemName:
          type:
            - string
            - "null"
        fromModifier:
          type:
            - string
            - "null"
        fromLevel:
          type:
            - integer
            - "null"
        toModifier:
          type:
            - string
            - "null"
        toLevel:
          type:
            - integer
            - "null"
    StatChange:
      type: object
      additionalProperties: false
      required:
        - statKey
        - finalValue
        - variantValue
      properties:
        statKey:
          type: string
        finalValue:
          type:
            - string
            - "null"
        variantValue:
          type:
            - string
            - "null"
    OptimizationVariant:
      type: object
      additionalProperties: false
      required:
        - main
        - bonusName
        - finalValue
        - variantValue
        - gain
        - totalLoss
        - changeCount
        - score
        - changes
        - statChanges
        - setup
        - calculationResult
      properties:
        main:
          type: boolean
        bonusName:
          type:
            - string
            - "null"
        finalValue:
          type: number
        variantValue:
          type: number
        gain:
          type: number
        totalLoss:
          type: number
        changeCount:
          type: integer
        score:
          type: number
        changes:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/PlacementChange"
        statChanges:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/StatChange"
        setup:
          $ref: "#/components/schemas/EquipmentRequest"
        calculationResult:
          anyOf:
            - $ref: "#/components/schemas/CalculationResult"
            - type: "null"
    ItemDrifBonus:
      type: object
      additionalProperties: false
      required:
        - slotKey
        - itemName
      properties:
        slotKey:
          type: string
        itemName:
          type:
            - string
            - "null"
    OptimizationSummary:
      type: object
      additionalProperties: false
      required:
        - success
        - message
        - drifsPlaced
        - totalPowerUsed
        - executionTimeSeconds
        - warnings
        - itemsByDrifBonus
        - goalResults
        - nextVariants
      properties:
        outcome:
          type: [string, "null"]
          enum:
            [
              INVALID_INPUT,
              NO_BUILD_FOUND,
              VALID_BUILD_SOFT_TARGETS_UNMET,
              VALID_BUILD,
              null,
            ]
          description: Explicit result kind. Optional for compatibility with older responses.
        searchReport:
          oneOf:
            - $ref: "#/components/schemas/OptimizationSearchReport"
            - type: "null"
        success:
          type: boolean
          description:
            In build-from-scratch mode false also describes a valid build with unmet soft targets.
            Inspect optimizedSetup, calculationResult and warnings to distinguish it from a business failure
            without a build. The flag does not indicate proof of a global optimum.
        message:
          type:
            - string
            - "null"
        drifsPlaced:
          type: integer
        totalPowerUsed:
          type: integer
        executionTimeSeconds:
          type: number
        warnings:
          type:
            - array
            - "null"
          items:
            type: string
        itemsByDrifBonus:
          type:
            - object
            - "null"
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ItemDrifBonus"
        goalResults:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/GoalResult"
        nextVariants:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/OptimizationVariant"
    AdvisorPlan:
      type: object
      additionalProperties: false
      required:
        - kind
        - actions
        - upgrades
        - targetReached
        - drifCounts
      properties:
        actionDetails:
          type: array
          items:
            $ref: "#/components/schemas/AdvisorAction"
          description: Structured counterparts of actions; repeated upgrades of one drif are merged.
        kind:
          type: string
          enum:
            - MOVES
            - ONE_UPGRADE
            - PLAN
        actions:
          type: array
          items:
            type: string
        upgrades:
          type: integer
        targetReached:
          type: boolean
        drifCounts:
          type: object
          additionalProperties:
            type: integer
    AdvisorReport:
      type: object
      additionalProperties: false
      required:
        - evaluatedStates
        - timeLimitReached
        - cancelled
        - status
        - targetReached
        - baselineValue
        - goal
        - maxActions
        - searchSpaceExhausted
        - proofComplete
        - verifiedCandidates
        - candidateCount
        - plans
      properties:
        stopReason:
          $ref: "#/components/schemas/SearchStopReason"
        evaluatedStates:
          type: integer
        timeLimitReached:
          type: boolean
          description: Actual search or verification deadline reached; state limit is reported separately in stopReason.
        cancelled:
          type: boolean
        status:
          type: string
          enum:
            - OPTIMAL
            - BEST_FOUND
            - INFEASIBLE
            - CANCELLED
        targetReached:
          type: boolean
        baselineValue:
          type: number
        goal:
          type: string
        maxActions:
          type: integer
        searchSpaceExhausted:
          type: boolean
        proofComplete:
          type: boolean
        verifiedCandidates:
          type: integer
        candidateCount:
          type: integer
        plans:
          type: array
          items:
            $ref: "#/components/schemas/AdvisorPlan"
    SearchStopReason:
      type: string
      enum:
        [
          COMPLETED,
          OPERATION_LIMIT,
          TIME_LIMIT,
          STATE_LIMIT,
          CANCELLED,
          INTERRUPTED,
          NOT_STARTED,
        ]
    OptimizationSearchReport:
      type: object
      additionalProperties: false
      properties:
        stopReason:
          $ref: "#/components/schemas/SearchStopReason"
        proofComplete:
          type: boolean
          description: Always false for scratch heuristics, including a completed run.
        budgets:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required: [initial, consumed, remaining, exhausted]
            properties:
              initial: { type: integer, minimum: 0 }
              consumed: { type: integer, minimum: 0 }
              remaining: { type: integer, minimum: 0 }
              exhausted: { type: boolean }
        generatedNeighborhoodStates: { type: integer, minimum: 0 }
        evaluatedStates: { type: integer, minimum: 0 }
        verifiedStates:
          type: integer
          minimum: 0
          description: Authoritative calculator invocations including repeated final verification.
        evaluationCacheHits: { type: integer, minimum: 0 }
        calculatorCacheHits: { type: integer, minimum: 0 }
        peakEvaluationCacheEntries: { type: integer, minimum: 0 }
        peakCalculatorCacheEntries: { type: integer, minimum: 0 }
        peakDrifCacheEntries: { type: integer, minimum: 0 }
        stageSeconds:
          type: object
          additionalProperties: { type: number, minimum: 0 }
    AdvisorActionLocation:
      type: object
      additionalProperties: false
      required: [slotKey, socketIndex]
      properties:
        slotKey: { type: string }
        socketIndex: { type: integer, minimum: 0 }
    AdvisorDrifChange:
      type: object
      additionalProperties: false
      required: [identity, drifId, from, to, fromLevel, toLevel]
      properties:
        identity: { type: string }
        drifId: { type: integer }
        from:
          oneOf:
            - $ref: "#/components/schemas/AdvisorActionLocation"
            - type: "null"
        to:
          $ref: "#/components/schemas/AdvisorActionLocation"
        fromLevel: { type: [integer, "null"] }
        toLevel: { type: integer }
    AdvisorAction:
      type: object
      additionalProperties: false
      required: [type, slotKey, fromItemId, toItemId, fromStars, toStars, drifs]
      properties:
        type:
          type: string
          enum:
            [
              MOVE,
              SWAP,
              UPGRADE_DRIF,
              PURCHASE_DRIF,
              UPGRADE_STARS,
              REPLACE_ITEM,
            ]
        slotKey: { type: string }
        fromItemId: { type: [integer, "null"] }
        toItemId: { type: [integer, "null"] }
        fromStars: { type: [integer, "null"] }
        toStars: { type: [integer, "null"] }
        drifs:
          type: array
          items:
            $ref: "#/components/schemas/AdvisorDrifChange"
    OptimizationResponse:
      type: object
      additionalProperties: false
      required:
        - optimizedSetup
        - summary
        - calculationResult
        - advisorReport
      properties:
        targetSetup:
          description: Standard target setup before backpack substitutions, retained as an upgrade reference. Null outside the backpack option.
          anyOf:
            - $ref: "#/components/schemas/EquipmentRequest"
            - type: "null"
        backpackDrifUsages:
          description: Exact selected backpack occurrences consumed by substitutions, mapped to the final sockets. Null outside the backpack option.
          type: [array, "null"]
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [entryId, slotKey, drifIndex]
            properties:
              entryId: { type: string, minLength: 1, maxLength: 128 }
              slotKey:
                type: string
                enum:
                  [
                    helmet,
                    armor,
                    cape,
                    legs,
                    boots,
                    gloves,
                    belt,
                    weapon,
                    shield,
                    ring1,
                    ring2,
                    necklace,
                  ]
              drifIndex: { type: integer, minimum: 0, maximum: 7 }
        optimizedSetup:
          anyOf:
            - $ref: "#/components/schemas/EquipmentRequest"
            - type: "null"
        summary:
          $ref: "#/components/schemas/OptimizationSummary"
        calculationResult:
          anyOf:
            - $ref: "#/components/schemas/CalculationResult"
            - type: "null"
        advisorReport:
          anyOf:
            - $ref: "#/components/schemas/AdvisorReport"
            - type: "null"
    PublicGameRules:
      type: object
      additionalProperties: false
      required:
        - epicBuiltInDrifs
        - slotOrbRules
        - bonusTranslations
        - drifBasePowers
        - elementalTypes
      properties:
        epicBuiltInDrifs:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        slotOrbRules:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        bonusTranslations:
          type: object
          additionalProperties:
            type: string
        drifBasePowers:
          type: object
          additionalProperties:
            type: integer
        elementalTypes:
          type: array
          items:
            type: string
