spring.profiles.default=local
spring.application.name=broken-ranks-tool
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.datasource.driverClassName=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

optimizer.beam-search-steps=55000
optimizer.maximization-search-steps=20000
optimizer.refinement-search-steps=25000
optimizer.max-concurrent-runs=1
optimizer.memory.max-heap-usage-percent=85

abuse-protection.max-request-bytes=${ABUSE_PROTECTION_MAX_REQUEST_BYTES:262144}
abuse-protection.body.timeout=${REQUEST_BODY_TIMEOUT:15s}
abuse-protection.body.max-pending-requests=${REQUEST_BODY_MAX_PENDING_REQUESTS:8}
abuse-protection.body.max-pending-per-client=${REQUEST_BODY_MAX_PENDING_PER_CLIENT:2}
# Never drain an unfinished rejected body on an HTTP worker thread.
server.tomcat.max-swallow-size=0B
abuse-protection.trust-railway-client-ip=${TRUST_RAILWAY_CLIENT_IP:false}
abuse-protection.optimizer-ingress.client-requests-per-minute=${OPTIMIZER_INGRESS_CLIENT_REQUESTS_PER_MINUTE:60}
abuse-protection.optimizer-ingress.global-requests-per-minute=${OPTIMIZER_INGRESS_GLOBAL_REQUESTS_PER_MINUTE:600}
abuse-protection.optimizer.client-requests-per-minute=${OPTIMIZER_CLIENT_REQUESTS_PER_MINUTE:5}
abuse-protection.optimizer.global-requests-per-minute=${OPTIMIZER_GLOBAL_REQUESTS_PER_MINUTE:20}
abuse-protection.calculator.client-requests-per-minute=${CALCULATOR_CLIENT_REQUESTS_PER_MINUTE:120}
abuse-protection.calculator.global-requests-per-minute=${CALCULATOR_GLOBAL_REQUESTS_PER_MINUTE:600}
abuse-protection.control.client-requests-per-minute=${CONTROL_CLIENT_REQUESTS_PER_MINUTE:30}
abuse-protection.control.global-requests-per-minute=${CONTROL_GLOBAL_REQUESTS_PER_MINUTE:300}
abuse-protection.public-data.client-requests-per-minute=${PUBLIC_DATA_CLIENT_REQUESTS_PER_MINUTE:300}
abuse-protection.public-data.global-requests-per-minute=${PUBLIC_DATA_GLOBAL_REQUESTS_PER_MINUTE:3000}
