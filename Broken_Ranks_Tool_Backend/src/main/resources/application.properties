spring.profiles.default=local

spring.datasource.driverClassName=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

optimizer.beam-search-steps=55000
optimizer.maximization-search-steps=20000
optimizer.refinement-search-steps=25000
optimizer.max-concurrent-runs=1

abuse-protection.max-request-bytes=${ABUSE_PROTECTION_MAX_REQUEST_BYTES:262144}
abuse-protection.optimizer.client-requests-per-minute=${OPTIMIZER_CLIENT_REQUESTS_PER_MINUTE:3}
abuse-protection.optimizer.global-requests-per-minute=${OPTIMIZER_GLOBAL_REQUESTS_PER_MINUTE:12}
abuse-protection.calculator.client-requests-per-minute=${CALCULATOR_CLIENT_REQUESTS_PER_MINUTE:120}
abuse-protection.calculator.global-requests-per-minute=${CALCULATOR_GLOBAL_REQUESTS_PER_MINUTE:600}
spring.jpa.defer-datasource-initialization=false
