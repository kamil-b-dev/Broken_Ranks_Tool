server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:127[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}|0:0:0:0:0:0:0:1|::1}
server.tomcat.redirect-context-root=false
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-swallow-size=256KB
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:file:/app/data/broken_ranks.db?mode=ro}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.structured.format.console=logstash
