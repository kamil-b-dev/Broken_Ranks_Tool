server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX:10[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}|192[.]168[.][0-9]{1,3}[.][0-9]{1,3}|169[.]254[.][0-9]{1,3}[.][0-9]{1,3}|172[.](1[6-9]|2[0-9]|3[01])[.][0-9]{1,3}[.][0-9]{1,3}|100[.](6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])[.][0-9]{1,3}[.][0-9]{1,3}|127[.][0-9]{1,3}[.][0-9]{1,3}[.][0-9]{1,3}|(?i:f[cd][0-9a-f:]+)|(?i:fe[89ab][0-9a-f:]+)|0:0:0:0:0:0:0:1|::1}
server.tomcat.redirect-context-root=false
server.tomcat.connection-timeout=10s
server.tomcat.keep-alive-timeout=20s
server.tomcat.max-swallow-size=256KB
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:/app/data/broken_ranks.db}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.compression.enabled=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [requestId:%X{requestId:-none}]
