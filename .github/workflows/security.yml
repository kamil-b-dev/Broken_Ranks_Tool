name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    branches: [dev, master]
    paths:
      - ".github/workflows/security.yml"
      - "Broken_Ranks_Tool_Backend/pom.xml"
      - "Broken_Ranks_Tool_Frontend/package.json"
      - "Broken_Ranks_Tool_Frontend/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
  push:
    branches: [master]
    paths:
      - ".github/workflows/security.yml"
      - "Broken_Ranks_Tool_Backend/pom.xml"
      - "Broken_Ranks_Tool_Frontend/package.json"
      - "Broken_Ranks_Tool_Frontend/package-lock.json"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Broken_Ranks_Tool_Frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Broken_Ranks_Tool_Frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  infrastructure-audit:
    name: Audit infrastructure dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  container-audit:
    name: Scan production container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --tag broken-ranks-tool:security .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: broken-ranks-tool:security
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Upload container findings
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: trivy-results.sarif

  backend-audit:
    name: Audit backend dependencies
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8ac9e5ce44cc7178e0e04229a91bdcc003166e57 # v2.5.0
    with:
      scan-args: |-
        --lockfile=./Broken_Ranks_Tool_Backend/pom.xml
