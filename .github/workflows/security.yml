name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Broken_Ranks_Tool_Frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Broken_Ranks_Tool_Frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  backend-audit:
    name: Audit backend dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Broken_Ranks_Tool_Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Broken_Ranks_Tool_Backend/pom.xml
      - name: Scan dependencies
        run: ./mvnw --batch-mode -Psecurity dependency-check:check
      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-dependency-report
          path: Broken_Ranks_Tool_Backend/target/dependency-check-report.*
          if-no-files-found: ignore
