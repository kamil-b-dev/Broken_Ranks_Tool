name: Dependency security

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  frontend-audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Broken_Ranks_Tool_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Broken_Ranks_Tool_Frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  backend-audit:
    name: Audit backend dependencies
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
    with:
      scan-args: |-
        --lockfile=./Broken_Ranks_Tool_Backend/pom.xml
