name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  merge_group:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Broken_Ranks_Tool_Backend/pom.xml
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Java for analysis
        if: matrix.language == 'java-kotlin'
        working-directory: Broken_Ranks_Tool_Backend
        run: ./mvnw --batch-mode --no-transfer-progress clean compile
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
