name: CodeQL

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 3"
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  merge_group:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Broken_Ranks_Tool_Backend/pom.xml
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml
      - name: Build Java for analysis
        if: matrix.language == 'java-kotlin'
        working-directory: Broken_Ranks_Tool_Backend
        run: ./mvnw --batch-mode --no-transfer-progress clean test-compile
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
