name: Quality checks

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Broken_Ranks_Tool_Backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Broken_Ranks_Tool_Backend/pom.xml

      - name: Verify backend
        run: ./mvnw --batch-mode clean verify

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: Broken_Ranks_Tool_Backend/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload backend for API integration tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-backend
          path: Broken_Ranks_Tool_Backend/target/*.jar
          if-no-files-found: error

  infrastructure:
    name: Infrastructure lint and API contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      - name: Test smoke assertions
        shell: pwsh
        run: ./scripts/smoke-assertions.tests.ps1

  integration:
    name: Real frontend-backend integration
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Broken_Ranks_Tool_Frontend/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: integration-backend
          path: Broken_Ranks_Tool_Backend/target
      - run: npm ci
      - run: npm ci
        working-directory: Broken_Ranks_Tool_Frontend
      - run: npx playwright install --with-deps chromium
        working-directory: Broken_Ranks_Tool_Frontend
      - name: Start read-only backend and test API integration
        shell: bash
        env:
          OPTIMIZER_CLIENT_REQUESTS_PER_MINUTE: "300"
          OPTIMIZER_GLOBAL_REQUESTS_PER_MINUTE: "300"
          CALCULATOR_CLIENT_REQUESTS_PER_MINUTE: "3000"
          CALCULATOR_GLOBAL_REQUESTS_PER_MINUTE: "3000"
          PUBLIC_DATA_CLIENT_REQUESTS_PER_MINUTE: "3000"
          PUBLIC_DATA_GLOBAL_REQUESTS_PER_MINUTE: "3000"
          CONTROL_CLIENT_REQUESTS_PER_MINUTE: "300"
          CONTROL_GLOBAL_REQUESTS_PER_MINUTE: "300"
        run: |
          cd Broken_Ranks_Tool_Backend
          jars=(target/*.jar)
          test "${#jars[@]}" -eq 1
          java -jar "${jars[0]}" --server.port=8082 --spring.profiles.active=prod \
            --spring.datasource.url="jdbc:sqlite:file:$PWD/database/catalog/broken_ranks.db?mode=ro" \
            > "$RUNNER_TEMP/integration-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8082/actuator/health/readiness | grep -q '"status":"UP"'; then
              ready=true
              break
            fi
            kill -0 "$backend_pid"
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/integration-backend.log"; exit 1; fi
          cd ..
          node scripts/check-api-contract.mjs http://127.0.0.1:8082
          cd Broken_Ranks_Tool_Frontend
          npm run test:integration
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-integration-report
          path: |
            Broken_Ranks_Tool_Frontend/playwright-report
            Broken_Ranks_Tool_Frontend/test-results
            ${{ runner.temp }}/integration-backend.log
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Broken_Ranks_Tool_Frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Broken_Ranks_Tool_Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Test frontend with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Check frontend bundle size
        run: npm run check:bundle-size

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: Broken_Ranks_Tool_Frontend/coverage
          if-no-files-found: ignore

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-report
          path: Broken_Ranks_Tool_Frontend/playwright-report
          if-no-files-found: ignore

  container-smoke:
    name: Production container smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build and verify the production image
        shell: pwsh
        run: ./scripts/smoke-test.ps1
