name: Quality checks

on:
  workflow_dispatch:
  schedule:
    - cron: "29 3 * * 1"
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select quality checks
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      infrastructure: ${{ steps.select.outputs.infrastructure }}
      integration: ${{ steps.select.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Select checks from changed files
        id: select
        run: node .github/scripts/select-quality-checks.mjs

  backend:
    name: Backend tests
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Broken_Ranks_Tool_Backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Broken_Ranks_Tool_Backend/pom.xml

      - name: Verify backend
        if: needs.changes.result != 'success' || needs.changes.outputs.backend == 'true'
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Package backend for frontend-only integration
        if: needs.changes.result == 'success' && needs.changes.outputs.backend != 'true'
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Upload backend coverage
        if: always() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: Broken_Ranks_Tool_Backend/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload backend for API integration tests
        if: needs.changes.result != 'success' || needs.changes.outputs.integration == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-backend
          path: Broken_Ranks_Tool_Backend/target/*.jar
          if-no-files-found: error

      - name: Verify repeated optimization under constrained heap
        if: needs.changes.result != 'success' || needs.changes.outputs.backend == 'true'
        env:
          JAVA_TOOL_OPTIONS: "-Xmx128m"
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=OptimizationArcherPerformanceBenchmark -Doptimizer.memory.repetitions=3 test

  infrastructure:
    name: Infrastructure lint and API contract checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.infrastructure == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      - run: npm run test:dependency-policy
      - run: npm run test:ci
      - name: Test smoke assertions
        shell: pwsh
        run: ./scripts/smoke-assertions.tests.ps1

  integration:
    name: Real frontend-backend integration
    needs: [changes, backend]
    if: ${{ !cancelled() && needs.backend.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.integration == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Broken_Ranks_Tool_Frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-backend
          path: Broken_Ranks_Tool_Backend/target
      - run: npm ci
      - run: npm ci
        working-directory: Broken_Ranks_Tool_Frontend
      - run: npx playwright install --with-deps chromium
        working-directory: Broken_Ranks_Tool_Frontend
      - name: Start read-only backend and test API integration
        shell: bash
        env:
          OPTIMIZER_CLIENT_REQUESTS_PER_MINUTE: "300"
          OPTIMIZER_GLOBAL_REQUESTS_PER_MINUTE: "300"
          CALCULATOR_CLIENT_REQUESTS_PER_MINUTE: "3000"
          CALCULATOR_GLOBAL_REQUESTS_PER_MINUTE: "3000"
          PUBLIC_DATA_CLIENT_REQUESTS_PER_MINUTE: "3000"
          PUBLIC_DATA_GLOBAL_REQUESTS_PER_MINUTE: "3000"
          CONTROL_CLIENT_REQUESTS_PER_MINUTE: "300"
          CONTROL_GLOBAL_REQUESTS_PER_MINUTE: "300"
        run: |
          cd Broken_Ranks_Tool_Backend
          jars=(target/*.jar)
          test "${#jars[@]}" -eq 1
          java -jar "${jars[0]}" --server.port=8082 --spring.profiles.active=prod \
            --spring.datasource.url="jdbc:sqlite:file:$PWD/database/catalog/broken_ranks.db?mode=ro" \
            > "$RUNNER_TEMP/integration-backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8082/actuator/health/readiness | grep -q '"status":"UP"'; then
              ready=true
              break
            fi
            kill -0 "$backend_pid"
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/integration-backend.log"; exit 1; fi
          cd ..
          node scripts/check-api-contract.mjs http://127.0.0.1:8082
          cd Broken_Ranks_Tool_Frontend
          npm run test:integration
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-integration-report
          path: |
            Broken_Ranks_Tool_Frontend/playwright-report
            Broken_Ranks_Tool_Frontend/test-results
            ${{ runner.temp }}/integration-backend.log
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Broken_Ranks_Tool_Frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Broken_Ranks_Tool_Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Check frontend formatting
        run: npm run format:check

      - name: Test frontend with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build

      - name: Check frontend bundle size
        run: npm run check:bundle-size

      - name: Configure Ubuntu package downloads
        timeout-minutes: 1
        run: |
          # Prefer the Ubuntu archive; the Azure mirror has stalled dependency downloads.
          printf '%s\tpriority:%s\n' \
            'https://archive.ubuntu.com/ubuntu/' 1 \
            'https://security.ubuntu.com/ubuntu/' 2 \
            'http://azure.archive.ubuntu.com/ubuntu/' 3 \
            | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo tee /etc/apt/apt.conf.d/zz-playwright-downloads > /dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout

      - name: Install Playwright system dependencies
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: npx playwright install chromium webkit

      - name: Run browser tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"

      - name: Check production UI performance budgets
        run: npm run test:performance
        env:
          PLAYWRIGHT_USE_EXISTING_BUILD: "1"

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: Broken_Ranks_Tool_Frontend/coverage
          if-no-files-found: ignore

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-report
          path: Broken_Ranks_Tool_Frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload production UI performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-ui-performance
          path: Broken_Ranks_Tool_Frontend/performance-report
          if-no-files-found: ignore

  container-smoke:
    name: Production container smoke test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify the production image
        shell: pwsh
        run: ./scripts/smoke-test.ps1
