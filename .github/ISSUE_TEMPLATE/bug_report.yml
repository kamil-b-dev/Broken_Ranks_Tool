name: Błąd / Bug report
description: Zgłoś problem z Broken Ranks Tool / Report a problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Zgłoszenie jest publiczne. Dołącz tylko build potrzebny do odtworzenia błędu, bez prywatnych notatek.
        Podatności zgłaszaj przez Security → Report a vulnerability.

        This report is public. Include only the build needed to reproduce the issue, without private notes.
        Report vulnerabilities through Security → Report a vulnerability.
  - type: textarea
    id: steps
    attributes:
      label: Jak odtworzyć / Steps to reproduce
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Wynik i oczekiwane zachowanie / Actual and expected result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Przeglądarka i urządzenie / Browser and device
      placeholder: "Firefox, Windows / Safari, iPhone"
  - type: textarea
    id: details
    attributes:
      label: Dodatkowe informacje / Additional details
      description: "Opcjonalnie: zrzut ekranu, build, requestId błędu. / Optional: screenshot, build, error requestId."
