version: 2
updates:
  - package-ecosystem: maven
    directory: /Broken_Ranks_Tool_Backend
    target-branch: dev
    ignore:
      # Regression reproduced by OptimizationExhaustiveSearchTests; google/or-tools#5003.
      - dependency-name: com.google.ortools:ortools-java
        versions: ["[9.15,9.16)"]
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Warsaw
    groups:
      backend-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Security updates target the default branch; maintain it as well as dev.
  - package-ecosystem: maven
    directory: /Broken_Ranks_Tool_Backend
    ignore:
      - dependency-name: com.google.ortools:ortools-java
        versions: ["[9.15,9.16)"]
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Warsaw
    groups:
      backend-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      backend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /Broken_Ranks_Tool_Frontend
    ignore:
      # React 19.3 exceeds the unchanged mobile startup budget; retain patched 19.2.
      - dependency-name: react
        versions: ["19.3.x"]
      - dependency-name: react-dom
        versions: ["19.3.x"]
      - dependency-name: "@types/react"
        versions: ["19.3.x"]
      - dependency-name: "@types/react-dom"
        versions: ["19.3.x"]
    schedule:
      interval: daily
    groups:
      frontend-eslint:
        applies-to: version-updates
        patterns: [eslint, "@eslint/js"]
      frontend-vitest:
        applies-to: version-updates
        patterns: [vitest, "@vitest/*"]
      frontend-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    ignore:
      # Match the Node 22 runtime used by CI and Docker.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    schedule:
      interval: daily
    groups:
      infrastructure-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
      infrastructure-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    # Keep the supported runtime lines; continue receiving patch and digest updates.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns: ["*"]
